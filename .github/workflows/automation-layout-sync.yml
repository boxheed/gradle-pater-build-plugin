name: 'automation: layout sync'

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  layout-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Git Identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Apply project layout
        run: |
          chmod +x ./gradlew
          ./gradlew applyLayout

      - name: Create or update Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Layout is already up to date."
            exit 0
          fi

          TARGET_BRANCH="develop"
          SYNC_BRANCH="chore/layout-sync-${TARGET_BRANCH}"
          COMMIT_MSG="chore(layout): sync project layout"

          git checkout -B "${SYNC_BRANCH}"
          git add -A
          git commit -m "${COMMIT_MSG}"
          git push -f -u origin "${SYNC_BRANCH}"

          PR_URL=$(gh pr list --state open --head "${SYNC_BRANCH}" --base "${TARGET_BRANCH}" --json url --jq '.[0].url' 2>/dev/null || true)
          if [[ -z "${PR_URL}" ]]; then
            PR_URL=$(gh pr create \
              --base "${TARGET_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title "${COMMIT_MSG}" \
              --body "Automated layout sync generated by \`./gradlew applyLayout\`.")
          else
            gh pr edit "${PR_URL}" \
              --title "${COMMIT_MSG}" \
              --body "Automated layout sync updated by \`./gradlew applyLayout\`."
          fi

          gh pr merge --auto --squash "${PR_URL}"

# Java Gradle CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-java/ for more details
#
version: 2.1

commands:
  setup-ci:
    steps:
      - run:
          name: Setup Gradle & Git
          command: |
            mkdir -p ~/.gradle
            { printenv | grep GRADLE_PROP | cut -d'=' -f 2- || true; } >> ~/.gradle/gradle.properties
            echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
            echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties
            git config --global user.name "${CIRCLE_USERNAME:-ci}"
            git config --global user.email "${CIRCLE_USERNAME:-ci}@users.noreply.github.com"

jobs:
  build:
    docker:
      # specify the version you desire here
      - image: cimg/openjdk:17.0
    working_directory: ~/repo
    environment:
      # Customize the JVM maximum heap limit
      JVM_OPTS: -Xmx3200m
      TERM: dumb
    steps:
      - setup-ci
      - checkout
      - run: ./gradlew clean build 
  
  security:
    docker:
      - image: cimg/openjdk:17.0
    working_directory: ~/repo
    steps:
      - checkout
      - run: ./gradlew --write-locks resolveAndLockAll
      - run: ./gradlew osvInstall
      - run: ./gradlew osvScan

  release:
    docker:
      # specify the version you desire here
      - image: cimg/openjdk:17.0
    working_directory: ~/repo
    environment:
      # Customize the JVM maximum heap limit
      JVM_OPTS: -Xmx3200m
      TERM: dumb
    steps:
      - setup-ci
      - checkout
      - run: ./gradlew tagSemver
      - run: "git checkout develop && git merge $CIRCLE_BRANCH -m \"fix(release): merge $CIRCLE_BRANCH into develop\" --no-ff"
      - run: git push --atomic origin $CIRCLE_BRANCH develop --tags

  publish:
    docker:
      # specify the version you desire here
      - image: cimg/openjdk:17.0
    working_directory: ~/repo
    environment:
      # Customize the JVM maximum heap limit
      JVM_OPTS: -Xmx3200m
      TERM: dumb
    steps:
      - setup-ci
      - checkout
      - run: ./gradlew build publish publishPlugins githubRelease

workflows:
  build:
    jobs:
      - build:
          context: boxhead-builds
      - security:
          context: boxhead-builds
      - release:
          context: boxhead-builds
          requires:
            - build
            - security
          filters:
            branches:
              only: /^(?:main|master)$/
      - publish:
          context: boxhead-builds
          filters:
            # only act on version tags
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/       
